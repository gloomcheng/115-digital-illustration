<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">原創 AI 工具軌道圖</title>
  <desc id="desc">Prompt、生成、編修、GPU 與紀錄工具圍繞一張實驗卡；每個工具都有自己的能力與限制。</desc>
  <rect width="900" height="600" rx="28" fill="#122c47"/>
  <circle cx="450" cy="300" r="205" fill="none" stroke="#cfe7f0" stroke-width="3" stroke-dasharray="10 14" opacity=".7"/>
  <circle cx="450" cy="300" r="128" fill="#f7c94d" stroke="#fffaf0" stroke-width="5"/>
  <rect x="345" y="247" width="210" height="106" rx="12" fill="#fffaf0" stroke="#123d59" stroke-width="4"/>
  <text x="450" y="285" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="22" font-weight="700" fill="#123d59">實驗卡</text>
  <text x="450" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#ed765d">question / output / next</text>
  <g font-family="Noto Sans TC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <g><circle cx="450" cy="72" r="54" fill="#cfe7f0" stroke="#fffaf0" stroke-width="4"/><text x="450" y="79" fill="#123d59">Prompt</text></g>
    <g><circle cx="763" cy="205" r="54" fill="#ffd7cc" stroke="#fffaf0" stroke-width="4"/><text x="763" y="212" fill="#123d59">生成</text></g>
    <g><circle cx="710" cy="485" r="54" fill="#cfe7f0" stroke="#fffaf0" stroke-width="4"/><text x="710" y="492" fill="#123d59">編修</text></g>
    <g><circle cx="190" cy="485" r="54" fill="#ffe29a" stroke="#fffaf0" stroke-width="4"/><text x="190" y="492" fill="#123d59">GPU</text></g>
    <g><circle cx="137" cy="205" r="54" fill="#ffd7cc" stroke="#fffaf0" stroke-width="4"/><text x="137" y="212" fill="#123d59">紀錄</text></g>
  </g>
  <g fill="none" stroke="#ed765d" stroke-width="5" stroke-linecap="round"><path d="M450 128 V170"/><path d="M711 233 L628 266"/><path d="M678 438 L596 369"/><path d="M222 438 L306 369"/><path d="M189 233 L272 266"/></g>
</svg>
