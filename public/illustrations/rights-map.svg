<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">原創素材權利與用途關係圖</title>
  <desc id="desc">參考資料先經過來源與授權檢查，再進入繪本、貼圖與展演等用途。</desc>
  <rect width="900" height="600" rx="28" fill="#122c47"/>
  <g fill="#fffaf0" stroke="#cfe7f0" stroke-width="5"><rect x="55" y="225" width="190" height="130" rx="14"/><rect x="355" y="225" width="190" height="130" rx="14"/><rect x="665" y="110" width="180" height="100" rx="14"/><rect x="665" y="250" width="180" height="100" rx="14"/><rect x="665" y="390" width="180" height="100" rx="14"/></g>
  <g font-family="Noto Sans TC, sans-serif" text-anchor="middle" fill="#123d59" font-weight="700"><text x="150" y="273" font-size="23">參考資料</text><text x="150" y="315" font-size="17">圖片 / 字體 / 音訊</text><text x="450" y="273" font-size="23">權利檢查</text><text x="450" y="315" font-size="17">來源 / 條款 / 作者</text><text x="755" y="170" font-size="20">繪本</text><text x="755" y="310" font-size="20">貼圖</text><text x="755" y="450" font-size="20">展演</text></g>
  <g fill="none" stroke="#ed765d" stroke-width="8" stroke-linecap="round"><path d="M245 290 H340"/><path d="M545 290 H625"/><path d="M625 290 L650 160"/><path d="M625 290 H650"/><path d="M625 290 L650 440"/></g>
  <g fill="#ed765d"><path d="M340 290 l-20 -14 v28 z"/><path d="M625 290 l-20 -14 v28 z"/><path d="M650 160 l-20 -14 v28 z"/><path d="M650 440 l-20 -14 v28 z"/></g>
  <text x="450" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" fill="#f7c94d" font-weight="700">PROVENANCE BEFORE PUBLISH</text>
</svg>
