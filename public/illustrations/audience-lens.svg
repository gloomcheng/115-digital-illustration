<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">原創示意圖：同一頭牛因為服務對象不同而畫成兩種樣子</title>
  <desc id="desc">上方是同一個主體一頭牛，分岔點標出改變的變數是服務對象。左邊服務對象是過冬的獵人，同一個牛的剪影用碳線描邊並加上岩壁肌理，看得出生肖；右邊服務對象是神與修士，同一個剪影被塗成單一金色、去掉肌理，放進裝飾邊框成為符號。</desc>
  <rect width="900" height="600" rx="28" fill="#fffaf0"/>

  <defs>
    <symbol id="bull" viewBox="0 0 200 112">
      <path d="M62 84 C48 84 42 72 42 60 C42 40 56 26 82 26 C104 26 118 19 138 21 C161 23 172 38 172 60 C172 74 164 84 150 84 Z"/>
      <ellipse cx="30" cy="58" rx="27" ry="25"/>
      <ellipse cx="10" cy="63" rx="15" ry="13"/>
      <path d="M33 34 C24 18 32 5 47 1 C41 12 41 25 45 35 Z"/>
      <path d="M39 37 C33 25 39 16 50 12 C46 21 46 30 50 38 Z"/>
      <path d="M53 45 C66 40 75 45 72 53 C67 60 57 59 51 53 Z"/>
      <rect x="58" y="80" width="16" height="28" rx="7"/>
      <rect x="86" y="80" width="16" height="28" rx="7"/>
      <rect x="128" y="80" width="16" height="28" rx="7"/>
      <rect x="152" y="80" width="16" height="28" rx="7"/>
      <path d="M171 43 C186 50 188 69 179 81"/>
      <circle cx="33" cy="53" r="4.5" fill="#123d59"/>
      <circle cx="7" cy="58" r="3.5" fill="#123d59"/>
    </symbol>
  </defs>

  <rect x="310" y="52" width="280" height="88" rx="14" fill="#f7c94d" stroke="#123d59" stroke-width="5"/>
  <text x="450" y="94" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="30" font-weight="700" fill="#123d59">主體：一頭牛</text>
  <text x="450" y="123" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#123d59">same subject</text>

  <g stroke="#123d59" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M450 140 V196"/>
    <path d="M215 196 H685"/>
    <path d="M215 196 V236"/>
    <path d="M685 196 V236"/>
  </g>
  <g fill="#123d59">
    <path d="M215 252 l-13 -22 h26 z"/>
    <path d="M685 252 l-13 -22 h26 z"/>
  </g>
  <rect x="352" y="172" width="196" height="48" rx="12" fill="#ed765d" stroke="#123d59" stroke-width="4"/>
  <text x="450" y="204" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="24" font-weight="700" fill="#fffaf0">改變的變數</text>

  <rect x="45" y="252" width="330" height="300" rx="18" fill="#fffaf0" stroke="#123d59" stroke-width="5"/>
  <rect x="525" y="252" width="330" height="300" rx="18" fill="#fffaf0" stroke="#123d59" stroke-width="5"/>

  <path d="M64 316 h292 a18 18 0 0 1 18 18 v100 a18 18 0 0 1 -18 18 h-292 a18 18 0 0 1 -18 -18 v-100 a18 18 0 0 1 18 -18 z" fill="#cfe7f0"/>
  <g stroke="#0d5e82" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <path d="M60 336 l24 24 M84 336 l24 24 M108 336 l24 24 M132 336 l24 24 M156 336 l24 24 M180 336 l24 24 M204 336 l24 24 M228 336 l24 24 M252 336 l24 24 M276 336 l24 24 M300 336 l24 24 M324 336 l24 24"/>
    <path d="M60 412 l24 24 M84 412 l24 24 M108 412 l24 24 M132 412 l24 24 M156 412 l24 24 M180 412 l24 24 M204 412 l24 24 M228 412 l24 24 M252 412 l24 24 M276 412 l24 24 M300 412 l24 24 M324 412 l24 24"/>
  </g>
  <use href="#bull" x="110" y="330" width="200" height="112" fill="#fffaf0" stroke="#123d59" stroke-width="4" stroke-linejoin="round"/>
  <text x="210" y="508" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="23" font-weight="700" fill="#123d59">服務對象：過冬的獵人</text>
  <text x="210" y="538" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="21" fill="#0d5e82">碳線描輪廓，看得出生肖</text>

  <rect x="578" y="312" width="224" height="160" rx="8" fill="#fff0bf" stroke="#123d59" stroke-width="4"/>
  <g fill="#ed765d">
    <circle cx="590" cy="324" r="8"/>
    <circle cx="790" cy="324" r="8"/>
    <circle cx="590" cy="460" r="8"/>
    <circle cx="790" cy="460" r="8"/>
  </g>
  <g stroke="#123d59" stroke-width="3" fill="none">
    <path d="M578 342 h224 M578 442 h224"/>
  </g>
  <use href="#bull" x="590" y="330" width="200" height="112" fill="#f7c94d" stroke="#123d59" stroke-width="4" stroke-linejoin="round"/>
  <text x="690" y="508" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="23" font-weight="700" fill="#123d59">服務對象：神與修士</text>
  <text x="690" y="538" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="21" fill="#0d5e82">塗成單一色，放進裝飾框</text>
</svg>
